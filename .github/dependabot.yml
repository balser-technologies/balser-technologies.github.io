# Dependency updates. Minor and patch updates are grouped into one weekly PR and
# merged automatically once CI passes (see dependabot-auto-merge.yml). Major
# updates get their own PR and always need a human review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    # Wait a few days after a release before proposing it (supply-chain safety).
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Madrid
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
